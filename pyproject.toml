# Python environment for the tests: the DuckDB v2 preview wheel and DuckDB's sqllogictest runner.
# `make test` syncs it with uv into .venv.
[project]
name = "plume-dev"
version = "0"
requires-python = ">=3.11"
dependencies = [
    # Keep in sync with DUCKDB_VERSION in the Makefile: 2.0.0.dev2609250715 is v2.0.0-alpha43385.
    "duckdb==2.0.0.dev2609250715",
    "duckdb-sqllogictest @ git+https://github.com/duckdb/duckdb-sqllogictest-python@2ac8dbc012ddbd96a57dca37784fd8ee3c0eb021",
]

[tool.uv]
package = false
prerelease = "allow"

[dependency-groups]
dev = ["ruff==0.16.9"]
