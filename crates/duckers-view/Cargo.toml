[package]
name = "duckers-view"
version = "0.1.0"
edition = "2024"
description = "Shows a rendered chart image in the terminal, a native window or the browser"
license = "MIT OR Apache-2.0"
publish = false

[features]
default = ["window"]
# The native window viewer. Without it, `Viewer::Window` reports itself unavailable.
# On Linux and the BSDs it uses X11, which Wayland desktops provide through Xwayland.
window = ["dep:minifb"]
# Native Wayland windows as well, tried before X11. They load the system libwayland, which prints
# "queue ... destroyed while proxies still attached" to stderr each time a window is closed.
wayland = ["window", "minifb/wayland", "minifb/dlopen"]

[dependencies]
base64 = "0.22"
# X11 only by default. minifb's Wayland backend comes in two forms, and neither fits a default:
# - with `dlopen` (minifb's default) it loads the system libwayland, which prints "queue ... destroyed
#   while proxies still attached" to stderr whenever minifb closes a window, since minifb destroys its
#   event queue before the objects attached to it;
# - without `dlopen` it speaks the protocol in Rust and closes silently, but links libxkbcommon.so.0,
#   so the extension would not load at all on a machine without that library.
# x11-dl loads libX11 at run time, so the X11 backend needs nothing at load time.
minifb = { version = "0.28", optional = true, default-features = false, features = ["x11"] }
png = "0.18"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
