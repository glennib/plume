[package]
name = "duckers-view"
version = "0.1.0"
edition = "2024"
description = "Shows a rendered chart image in the terminal, a native window or the browser"
license = "MIT OR Apache-2.0"
publish = false

[features]
default = ["window"]
# The native window viewer. Without it, `Viewer::Window` reports itself unavailable.
window = ["dep:minifb"]

[dependencies]
base64 = "0.22"
minifb = { version = "0.28", optional = true }
png = "0.18"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
