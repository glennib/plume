[package]
name = "plume-sys"
description = "Raw bindings to the DuckDB v2 C extension API (duckdb_extension_v2.h)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
# Regenerates src/bindings.rs from the vendored headers with bindgen (needs libclang).
generate-bindings = ["dep:bindgen"]

[build-dependencies]
bindgen = { version = "0.73", optional = true }
