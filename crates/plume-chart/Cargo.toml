[package]
name = "plume-chart"
version = "0.1.0"
edition = "2024"
description = "The chart values and plotters renderer behind plume, independent of DuckDB"
publish = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
plotters = { version = "0.3.7", default-features = false, features = [
    "svg_backend",
    "bitmap_backend",
    "ab_glyph",
    "chrono",
    "full_palette",
    "line_series",
    "point_series",
    "area_series",
    "errorbar",
    "candlestick",
    "boxplot",
] }
plotters-backend = "0.3.7"
png = "0.18.1"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
insta = "1.48.0"
